[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signverse-system"
version = "0.1.0"
description = "A modular system for 3D human pose estimation and AI simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "opencv-python-headless>=4.8.1",
    "mediapipe>=0.10.0",
    "redis>=5.0.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
]

[tool.setuptools.packages.find]
where = ["services", "api"] # Tells setuptools where to find Python packages
