apiVersion: apps/v1
kind: Deployment
metadata:
  name: signverse-ai-engine
  labels:
    app: signverse-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: signverse-ai
  template:
    metadata:
      labels:
        app: signverse-ai
    spec:
      containers:
        - name: inference-engine
          image: signverse/ai-engine:latest
          resources:
            limits:
              nvidia.com/gpu: 1
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: "/app/models"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine-service
spec:
  selector:
    app: signverse-ai
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
