apiVersion: apps/v1
kind: Deployment
metadata:
  name: signverse-backend
  labels:
    app: signverse-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: signverse-backend
  template:
    metadata:
      labels:
        app: signverse-backend
    spec:
      containers:
        - name: backend
          image: signverse/backend:latest
          ports:
            - containerPort: 8001
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
              nvidia.com/gpu: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 5
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: signverse-secrets
                  key: database-url
            - name: AI_ENGINE_URL
              value: "http://ai-engine-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: signverse-backend
  ports:
    - port: 8001
      targetPort: 8001
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: signverse-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: signverse-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
