version: '3.8'

services:
  # API Gateway
  gateway:
    image: signverse/gateway:latest
    ports:
      - "443:443"
    environment:
      - MODE=production
    depends_on:
      - sign-to-text
      - text-to-sign
      - speech-to-text
      - text-to-speech
  
  # Core translation services
  sign-to-text:
    image: signverse/sign-to-text:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
    environment:
      - MODEL_PATH=/models/sign_to_text_v3.pt
  
  text-to-sign:
    image: signverse/text-to-sign:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
  
  speech-to-text:
    image: signverse/speech-to-text:latest
    # Uses CPU
  
  text-to-speech:
    image: signverse/text-to-speech:latest
    # Uses CPU
  
  # Real-time WebSocket service
  websocket:
    image: signverse/websocket:latest
    ports:
      - "8765:8765"
    environment:
      - SIGNVERSE_API_URL=http://sign-to-text:8001
  
  # Monitoring
  monitoring:
    image: prom/prometheus:latest
    volumes:
      - ./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=signverse_admin
    ports:
      - "3000:3000"
    depends_on:
      - monitoring

  # Frontend (static)
  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
      args:
        VITE_BACKEND_URL: https://signverse.ai
        VITE_INFERENCE_URL: https://inference.signverse.ai
    ports:
      - "80:80"
