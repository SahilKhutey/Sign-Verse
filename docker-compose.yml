version: "3.8"

services:
  ai-engine:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.ai
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - MODEL_PATH=/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./signverse.db
      - AI_ENGINE_URL=http://ai-engine:8000
    depends_on:
      - ai-engine

  avatar-api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.ai
    ports:
      - "8002:8002"
    command: [ "uvicorn", "avatar_animation.unity_bridge.animation_api:app", "--host", "0.0.0.0", "--port", "8002" ]
    depends_on:
      - ai-engine
