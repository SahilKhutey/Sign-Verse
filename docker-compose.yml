version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai-engine:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.ai
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODEL_PATH=/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets
    environment:
      - DATABASE_URL=sqlite:///app/data/signverse.db
      - AI_ENGINE_URL=http://ai-engine:8000
    depends_on:
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy

  avatar-api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.ai
    ports:
      - "8002:8002"
    command: ["gunicorn", "-k", "uvicorn.workers.UvicornWorker", "avatar_animation.unity_bridge.animation_api:app", "--bind", "0.0.0.0:8002"]
    depends_on:
      ai-engine:
        condition: service_healthy

  automated-trainer:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.ai
    volumes:
      - ./models:/app/models
      - ./datasets:/app/datasets
    environment:
      - TRAINING_THRESHOLD=50
      - WATCH_DIR=/app/datasets/user_feedback/pending_validation
    command: ["python3", "-m", "training.automated_trainer"]
    depends_on:
      ai-engine:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
      args:
        VITE_BACKEND_URL: http://localhost:8001
        VITE_INFERENCE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  models:
  datasets:
  data:
