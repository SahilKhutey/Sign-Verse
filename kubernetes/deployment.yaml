apiVersion: apps/v1
kind: Deployment
metadata:
  name: signverse-inference
  labels:
    app: signverse-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: signverse-inference
  template:
    metadata:
      labels:
        app: signverse-inference
    spec:
      containers:
      - name: inference-engine
        image: signverse-ai/inference-engine:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        env:
        - name: MODEL_REGISTRY_PATH
          value: "/models/model_registry.json"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: signverse-inference-service
spec:
  selector:
    app: signverse-inference
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
