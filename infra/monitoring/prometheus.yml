# Prometheus configuration for SignVerse High-Availability Monitoring
# Handles local, containerized, and Kubernetes-native service discovery

global:
  scrape_interval: 15s      # High-fidelity metrics for real-time pose tracking analytics
  evaluation_interval: 15s
  external_labels:
    monitor: 'signverse-monitor'

# Alerting Rules Integration
rule_files:
  - 'alert.rules.yml'

# Scrape Configurations: How Prometheus ingests metrics
scrape_configs:
  # 1. Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Backend API: Monitoring the AI Foundation Server
  - job_name: 'signverse-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['signverse-backend:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: signverse-backend:8000

  # 3. Redis Cache: Monitoring via redis-exporter sidecar
  - job_name: 'signverse-redis'
    static_configs:
      - targets: ['signverse-redis:9121']
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: __address__
        replacement: signverse-redis:9121

  # 4. Kubernetes Service Discovery (SD): Automated pod monitoring
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # Filter pods with 'prometheus.io/scrape' annotation set to true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      # Dynamically set metrics path from annotation
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # Dynamically set port from annotation
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # Map all pod labels into Prometheus labels
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      # Project namespace and pod name into labels
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

# Alertmanager connectivity
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
