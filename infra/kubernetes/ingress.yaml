apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signverse-ingress
  namespace: signverse
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  tls:
  - hosts:
    - signverse.example.com
    secretName: signverse-tls
  rules:
  - host: signverse.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: signverse-frontend
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: signverse-backend
            port:
              number: 8000
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: signverse-backend
            port:
              number: 8000
