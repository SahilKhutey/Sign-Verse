apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: signverse
data:
  app.yaml: |
    app:
      name: "signverse-system"
      version: "1.0.0"
      environment: "production"
    api:
      host: "0.0.0.0"
      port: 8000
  database.yaml: |
    postgresql:
      host: "signverse-db"
      port: 5432
      database: "signverse"
  redis.yaml: |
    redis:
      host: "signverse-redis"
      port: 6379
