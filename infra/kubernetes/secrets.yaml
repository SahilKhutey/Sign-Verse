apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: signverse
type: Opaque
data:
  password: c2VjcmV0X3Bhc3N3b3Jk  # base64 encoded "secret_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: signverse
type: Opaque
data:
  username: c2lnbnZlcnNl  # base64 encoded "signverse"
  password: c2VjcmV0X2RiX3Bhc3N3b3Jk  # base64 encoded "secret_db_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: signverse
type: Opaque
data:
  jwt-secret: c2VjcmV0X2p3dF9rZXk=  # base64 encoded "secret_jwt_key"
  api-key: c2VjcmV0X2FwaV9rZXk=  # base64 encoded "secret_api_key"
