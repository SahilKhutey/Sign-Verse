apiVersion: apps/v1
kind: Deployment
metadata:
  name: signverse-frontend
  namespace: signverse
  labels:
    app: signverse-frontend
    tier: frontend
    component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signverse-frontend
      tier: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: signverse-frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        # Note: Replace 'your-registry' with the actual container registry URL
        image: your-registry/signverse-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http-ui
        env:
        - name: API_BASE_URL
          value: "http://signverse-backend:8000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: signverse-frontend
  namespace: signverse
  labels:
    app: signverse-frontend
    tier: frontend
spec:
  selector:
    app: signverse-frontend
    tier: frontend
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  type: ClusterIP
