# Redis configuration for SignVerse AI Pipeline
# Optimized for high-fidelity pose sequence caching and persistent session management

# Networking
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300
daemonize no               # Critical for Docker (process must stay in foreground)
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16
always-show-logo no
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"

# Memory management
# Set to 2GB to accommodate massive concurrent pose estimations and video buffers
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence (RDB Snapshots)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
rdb-del-sync-files no
dir /data

# Append Only File (High Integrity Persistence)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Security
# Password should be injected via Docker environment variables or K8s secrets
# requirepass your_secure_password_here

# Clients & Scale
maxclients 10000

# Performance Tuning
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
