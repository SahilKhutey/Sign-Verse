name: Deploy SignVerse

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/ --cov=./ --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push backend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: infra/docker/backend.Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/signverse-backend:latest
    
    - name: Build and push frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ../infra/docker/frontend.Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/signverse-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
    
    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region us-west-2 --name signverse-cluster
    
    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/signverse-backend backend=${{ secrets.DOCKER_USERNAME }}/signverse-backend:latest -n signverse
        kubectl set image deployment/signverse-frontend frontend=${{ secrets.DOCKER_USERNAME }}/signverse-frontend:latest -n signverse
        kubectl rollout status deployment/signverse-backend -n signverse --timeout=300s
        kubectl rollout status deployment/signverse-frontend -n signverse --timeout=300s
