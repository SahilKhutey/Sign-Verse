name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check . --exclude datasets,models,logs,wandb_runs,training-data,frontend/node_modules,venv

      - name: Tests (pytest)
        run: pytest -q

      - name: Dataset report build
        run: |
          python training/data_pipeline/build_text_gloss_dataset.py --max-pairs 200
          python -c "import json; data=json.load(open('reports/text_gloss_dataset_report.json')); required=['total_pairs','train_pairs','val_pairs','test_pairs','length_stats','top_tokens']; missing=[k for k in required if k not in data]; assert not missing, f'Missing keys: {missing}'"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
